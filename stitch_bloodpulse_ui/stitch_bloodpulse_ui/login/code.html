<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Transactional Screen: Navigation Suppressed -->
<main class="w-full max-w-md bg-surface-container-lowest shadow-[0_4px_12px_rgba(142,125,127,0.04)] rounded-[24px] p-lg md:p-xl flex flex-col items-center">
<!-- Brand Identity -->
<div class="flex flex-col items-center mb-xl">
<div class="w-24 h-24 mb-md rounded-full overflow-hidden shadow-sm bg-surface-variant flex items-center justify-center">
<img alt="BloodPulse Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRIovjJ_duPDTBqKc01E36rcYVtHH_VPibtxhQ99eerruBdeuLiv_XT4eT1cAALVVgoyRTh9x5GdZg9eqTjULxJELv3ojHUP-gguJ5QqR75YWPw-EOhKIYWQ42xKAEZf9BACCUcXmAdMagLoWjb3pJ7jLrFU16qU4lXhNGeu8_03oFSZFr-xWxQYQeocmRiM4vSFfSl2P3TxT50mIGG8CzdQpubmiblzBtefpG2kE_g6sMA4ncMhbaQ8F_L5KV5-42qfALWnFxvbA">
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">BloodPulse</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-sm text-center">Welcome back to the community.<br>Your donation matters.</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface pl-4" for="username">Username or Phone</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-surface-container-lowest border border-outline/30 rounded-full py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-colors placeholder:text-outline/50" id="username" placeholder="Enter your credentials" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-md text-label-md text-on-surface pl-4" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline/30 rounded-full py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-tertiary-container focus:ring-1 focus:ring-tertiary-container transition-colors placeholder:text-outline/50" id="password" placeholder="••••••••" type="password">
</div>
<div class="flex justify-end mt-1 pr-2">
<a class="font-label-md text-label-md text-tertiary hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Actions -->
<div class="mt-lg flex flex-col gap-md items-center w-full">
<button class="w-full bg-primary-container text-on-primary-container font-button text-button py-3 px-6 rounded-full hover:opacity-90 active:scale-[0.98] transition-all shadow-sm flex justify-center items-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-sm">
                    Don't have an account? 
                    <a class="font-label-lg text-label-lg text-primary hover:underline underline-offset-2" href="#">Create an Account</a>
</p>
</div>
</form>
</main>


</body></html>
