<!-- Interactive script for subtle hover effects -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const primaryBtn = document.querySelector('button');
            
            primaryBtn.addEventListener('mouseenter', () => {
                const drop = document.querySelector('svg path');
                drop.style.transition = 'fill 0.5s ease';
                // Slightly intensify the gradient via property change would be complex, 
                // so we just handle simple button interaction states through tailwind
            });

            // Handle the progress step simulation
            let currentStep = 1;
            const progressBars = document.querySelectorAll('[aria-label="Onboarding Progress"] > div');
            
            // This is just a UI demo, so we'll just cycle them if the button is clicked for fun
            primaryBtn.addEventListener('click', (e) => {
                if (currentStep < 3) {
                    e.preventDefault();
                    currentStep++;
                    progressBars.forEach((bar, index) => {
                        if (index < currentStep) {
                            bar.classList.remove('bg-outline-variant');
                            bar.classList.add('bg-primary');
                        } else {
                            bar.classList.add('bg-outline-variant');
                            bar.classList.remove('bg-primary');
                        }
                    });
                    
                    // Simple page transition simulation
                    const mainContent = document.querySelector('main > div.z-10');
                    mainContent.style.opacity = '0';
                    mainContent.style.transform = 'translateY(-10px)';
                    
                    setTimeout(() => {
                        mainContent.style.transition = 'all 0.4s ease-out';
                        mainContent.style.opacity = '1';
                        mainContent.style.transform = 'translateY(0)';
                        
                        // Update text for step 2 (Simulation)
                        if(currentStep === 2) {
                            document.querySelector('p').innerText = "Verified by NID. Our secure system ensures that every donor and recipient is authenticated for your peace of mind.";
                        } else if(currentStep === 3) {
                            document.querySelector('p').innerText = "Immediate Response. Connect with donors across all 64 districts instantly when urgency strikes.";
                            primaryBtn.innerText = "Complete Setup";
                        }
                    }, 400);
                }
            });
        });
    </script>
