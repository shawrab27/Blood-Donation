<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="blood_pulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>blood_pulse</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #FDF3F3 !important;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    @keyframes pulse-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FDF3F3;">
    <div style="width: 48px; height: 48px; border: 4px solid #E6BDBA; border-top: 4px solid #C30121; border-radius: 50%; animation: pulse-spin 0.9s linear infinite;"></div>
    <div style="margin-top: 16px; font-family: Georgia, serif; font-size: 20px; font-weight: bold; color: #C30121;">BloodPulse</div>
    <div style="margin-top: 4px; font-family: sans-serif; font-size: 12px; color: #666;">Loading Application...</div>
  </div>
  <script>
    // Remove loading overlay as soon as Flutter mounts flutter-view or flt-glass-pane
    const observer = new MutationObserver((mutations) => {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('flt-scene-host')) {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.25s ease';
          setTimeout(() => loader.remove(), 250);
        }
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
