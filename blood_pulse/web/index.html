  <style>
    html, body {
      background-color: #FFFFFF !important;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    @keyframes ecg-trace {
      0% {
        stroke-dashoffset: 60;
      }
      100% {
        stroke-dashoffset: -200;
      }
    }
    @keyframes heartbeat-bounce {
      0%, 100% {
        transform: scale(1);
      }
      30% {
        transform: scale(1.04);
      }
      40% {
        transform: scale(0.98);
      }
      50% {
        transform: scale(1.07);
      }
      65% {
        transform: scale(1);
      }
    }
    .bp-heartbeat-box {
      width: 88px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: heartbeat-bounce 1.4s ease-in-out infinite;
    }
    .bp-ecg-svg {
      width: 88px;
      height: 48px;
      overflow: visible;
    }
    .bp-ecg-bg {
      stroke: #E6BDBA;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.45;
    }
    .bp-ecg-pulse {
      stroke: #C30121;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 60 200;
      filter: drop-shadow(0 0 2px rgba(195, 1, 33, 0.45));
      animation: ecg-trace 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .bp-heartbeat-box {
        animation: none;
      }
      .bp-ecg-pulse {
        animation: none;
        stroke-dasharray: none;
        filter: none;
      }
    }
    /* Offline page styles */

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('bloodpulse_sw.js', {scope: './'})
          .then((reg) => { console.log('[SW] registered:', reg.scope); })
          .catch((err) => { console.warn('[SW] registration failed:', err); });
        navigator.serviceWorker.register('firebase-messaging-sw.js', {scope: './'})
          .then((reg) => { console.log('[FCM SW] registered:', reg.scope); })
          .catch((err) => { console.warn('[FCM SW] registration failed:', err); });
      });
    }

    function removeLoader() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        loader.style.transition = 'opacity 0.3s ease';
        setTimeout(() => {
          try { loader.remove(); } catch (_) {}
        }, 300);
      }
    }

    // Trigger 1: Flutter first frame event
    window.addEventListener('flutter-first-frame', removeLoader);

    // Trigger 2: Periodic check for Flutter DOM elements
    const checkInterval = setInterval(() => {
      if (document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene-host') ||
          document.querySelector('canvas')) {
        removeLoader();
        clearInterval(checkInterval);
      }
    }, 100);

    // Trigger 3: Window load + short delay
    window.addEventListener('load', () => {
      setTimeout(() => {
        removeLoader();
        clearInterval(checkInterval);
      }, 1000);
    });

    // Trigger 4: Safety fallback
    setTimeout(() => {
      removeLoader();
      clearInterval(checkInterval);
    }, 3500);
  </script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          const swUrl = (registration.active || registration.installing || registration.waiting)?.scriptURL || '';
          if (swUrl.includes('firebase-messaging-sw.js') || swUrl.includes('bloodpulse_sw.js')) {
            continue;
          }
          registration.unregister();
        }
      });
    }
  </script>
