<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BloodPulse – Nationwide blood donation network for Bangladesh. Donate, request, and save lives.">
  <meta name="theme-color" content="#C30121">
  <meta name="google-signin-client_id" content="404989190662-hojuqm8fie4lbrfuh62dspj8m9e1acgg.apps.googleusercontent.com">

  <!-- Open Graph -->
  <meta property="og:title" content="BloodPulse">
  <meta property="og:description" content="Nationwide blood donation network for Bangladesh.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="#C30121">
  <meta name="apple-mobile-web-app-title" content="BloodPulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BloodPulse</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      background-color: #FDF3F3 !important;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    @keyframes pulse-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* Offline page styles */
    #offline-page {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #FDF3F3;
      z-index: 999999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    #offline-page.visible { display: flex; }
    #offline-page h1 {
      font-family: Georgia, serif;
      color: #C30121;
      font-size: 24px;
      margin-bottom: 8px;
    }
    #offline-page p { color: #555; font-size: 15px; }
    #offline-retry {
      margin-top: 20px;
      padding: 12px 28px;
      background: #C30121;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Offline fallback (shown by service worker on fetch failure) -->
  <div id="offline-page">
    <div style="font-size: 40px; margin-bottom: 12px;">🩸</div>
    <h1>You're offline</h1>
    <p>BloodPulse needs an internet connection to work.<br>Please check your network and try again.</p>
    <button id="offline-retry" onclick="window.location.reload()">Retry</button>
  </div>

  <!-- Splash / loading screen -->
  <div id="loading-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FDF3F3;">
    <div style="width: 48px; height: 48px; border: 4px solid #E6BDBA; border-top: 4px solid #C30121; border-radius: 50%; animation: pulse-spin 0.9s linear infinite;"></div>
    <div style="margin-top: 16px; font-family: Georgia, serif; font-size: 20px; font-weight: bold; color: #C30121;">BloodPulse</div>
    <div style="margin-top: 4px; font-family: sans-serif; font-size: 12px; color: #666;">Loading Application...</div>
  </div>

  <script>
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('bloodpulse_sw.js', {scope: './'})
          .then((reg) => { console.log('[SW] registered:', reg.scope); })
          .catch((err) => { console.warn('[SW] registration failed:', err); });
      });
    }

    function removeLoader() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        loader.style.transition = 'opacity 0.3s ease';
        setTimeout(() => {
          try { loader.remove(); } catch (_) {}
        }, 300);
      }
    }

    // Trigger 1: Flutter first frame event
    window.addEventListener('flutter-first-frame', removeLoader);

    // Trigger 2: Periodic check for Flutter DOM elements
    const checkInterval = setInterval(() => {
      if (document.querySelector('flutter-view') ||
          document.querySelector('flt-glass-pane') ||
          document.querySelector('flt-scene-host') ||
          document.querySelector('canvas')) {
        removeLoader();
        clearInterval(checkInterval);
      }
    }, 100);

    // Trigger 3: Window load + short delay
    window.addEventListener('load', () => {
      setTimeout(() => {
        removeLoader();
        clearInterval(checkInterval);
      }, 1000);
    });

    // Trigger 4: Safety fallback
    setTimeout(() => {
      removeLoader();
      clearInterval(checkInterval);
    }, 3500);
  </script>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
