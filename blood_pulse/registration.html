<!DOCTYPE html><html lang="en" class="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Georgia:wght@700&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">try{
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fff8f7",
                        "inverse-primary": "#ffb4ab",
                        "surface-variant": "#fadcd8",
                        "primary-container": "#c32121",
                        "on-tertiary-fixed": "#001d35",
                        "background": "#fff8f7",
                        "background-alt": "#F7F7F7",
                        "on-primary-container": "#ffdad5",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#ffdad6",
                        "surface-container-highest": "#fadcd8",
                        "on-secondary-container": "#656464",
                        "tertiary-fixed": "#d0e4ff",
                        "surface-container-low": "#fff0ee",
                        "surface-container-high": "#ffe2de",
                        "on-surface-variant": "#5b403d",
                        "on-background": "#271716",
                        "on-tertiary-container": "#cfe4ff",
                        "on-error-container": "#93000a",
                        "surface": "#FFFFFF",
                        "primary": "#9e000e",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#3e2c2a",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed-variant": "#00497a",
                        "tertiary": "#004f83",
                        "secondary-fixed": "#e4e2e1",
                        "inverse-on-surface": "#ffedea",
                        "warning": "#F9A825",
                        "primary-fixed-dim": "#ffb4ab",
                        "outline-variant": "#e4beb9",
                        "surface-container": "#ffe9e6",
                        "error": "#B71C1C",
                        "on-secondary-fixed-variant": "#474746",
                        "surface-tint": "#ba191c",
                        "on-primary-fixed-variant": "#93000c",
                        "tertiary-fixed-dim": "#9ccaff",
                        "on-error": "#ffffff",
                        "secondary": "#5f5e5e",
                        "outline": "#906f6c",
                        "on-primary-fixed": "#410002",
                        "surface-dim": "#f1d3d0",
                        "error-container": "#ffdad6",
                        "trust-blue": "#1565C0",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#0068aa",
                        "success": "#2E7D32",
                        "secondary-container": "#e4e2e1",
                        "on-surface": "#271716",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-secondary-fixed": "#1b1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "0.75rem",
                        "margin-page": "2rem",
                        "stack-lg": "3rem",
                        "stack-md": "1.5rem",
                        "inset-card": "1.5rem",
                        "gutter": "1.5rem"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "headline-sm": ["Georgia"],
                        "headline-md": ["Georgia"],
                        "caption": ["Inter"],
                        "headline-lg": ["Georgia"],
                        "body-lg": ["Inter"],
                        "headline-lg-mobile": ["Georgia"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    }catch(_e){}</script></head><body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-lg">

    <main class="flex-1 flex flex-col items-center justify-center p-gutter max-w-7xl mx-auto w-full">
        
        <div class="w-full max-w-2xl bg-surface rounded-xl shadow-[0_4px_24px_rgba(43,43,43,0.08)] border border-surface-container-high overflow-hidden">
            
            <div class="p-8 text-center border-b border-surface-container-high bg-surface-bright">
                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4S7RLC5YQ8wsA_VlFVmWgGUMOj5iOP-3TSgVVyp6M_seOKREh_Wws2bKHnS32BUssMXoYWqQbVkSH7EOpyVcedALoeRSxj_1iEKRRn6DXieiycu2K8f5VH019j6CpoiGo9XXXsg7gMiFCVKjo5ZtYZmVIayB-rDWIkX4wmYcNZcCVJxZ73hnmaJsnNkUIDdYIw8DV6pmWuZnHBVDU19-Vu-TTydYuYZcxE5HBZQaUpIvscnkB_LWMboiYwiL4MvlUew" alt="Blood Pulse Logo" class="w-32 h-32 mx-auto object-contain mb-4">
                <h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Create Account</h1>
                <p class="font-body-sm text-body-sm text-secondary mt-2">Join the national blood donor registry.</p>
            </div>

            <form class="p-8 space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="fullName" class="block font-label-md text-label-md text-on-surface mb-2">Full Name</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">person</span>
                            </span>
                            <input type="text" id="fullName" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm" placeholder="John Doe">
                        </div>
                    </div>
                    <div>
                        <label for="username" class="block font-label-md text-label-md text-on-surface mb-2">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">alternate_email</span>
                            </span>
                            <input type="text" id="username" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm" placeholder="johndoe123">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="password" class="block font-label-md text-label-md text-on-surface mb-2">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">lock</span>
                            </span>
                            <input type="password" id="password" class="block w-full pl-10 pr-10 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm" placeholder="••••••••">
                        </div>
                        <p class="mt-1 font-caption text-caption text-secondary flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">shield</span> Encrypted securely</p>
                    </div>
                    <div>
                        <label for="bloodGroup" class="block font-label-md text-label-md text-on-surface mb-2">Blood Group</label>
                        <div class="relative">
                             <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-primary">bloodtype</span>
                            </span>
                            <select id="bloodGroup" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm bg-surface">
                                <option value="" disabled="" selected="">Select Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="district" class="block font-label-md text-label-md text-on-surface mb-2">District</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">location_on</span>
                            </span>
                            <select id="district" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm bg-surface">
                                <option value="" disabled="" selected="">Select District</option>
                                <option value="dhaka">Dhaka</option>
                                <option value="chittagong">Chittagong</option>
                                <option value="sylhet">Sylhet</option>
                                <!-- Other 61 districts omitted-->
                            </select>
                        </div>
                    </div>
                    <div>
                        <label for="nid" class="block font-label-md text-label-md text-on-surface mb-2">NID Number (17-digit)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-trust-blue">badge</span>
                            </span>
                            <input type="text" id="nid" class="block w-full pl-10 pr-10 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm" placeholder="12345678901234567" maxlength="17">
                        </div>
                         <p class="mt-1 font-caption text-caption text-secondary flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">lock</span> Identity verified securely</p>
                    </div>
                </div>
                
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="lastDonation" class="block font-label-md text-label-md text-on-surface mb-2">Last Donation Date (Optional)</label>
                         <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">calendar_today</span>
                            </span>
                            <input type="date" id="lastDonation" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm text-secondary">
                        </div>
                    </div>
                    <div>
                        <label for="institute" class="block font-label-md text-label-md text-on-surface mb-2">Institute/Organization (Optional)</label>
                        <div class="relative">
                             <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <span class="material-symbols-outlined text-secondary">domain</span>
                            </span>
                            <input type="text" id="institute" class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded-lg focus:ring-trust-blue focus:border-trust-blue sm:text-sm" placeholder="e.g., Dhaka University">
                        </div>
                    </div>
                </div>

                <div class="bg-surface-container-low p-4 rounded-lg border border-surface-container mt-6">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="terms" name="terms" type="checkbox" class="focus:ring-trust-blue h-4 w-4 text-trust-blue border-outline-variant rounded">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="terms" class="font-body-sm text-body-sm text-on-surface">
                                I agree to the <a href="#" class="text-trust-blue underline">Terms &amp; Conditions</a> and consent to data processing under the Digital Security Act 2018.
                            </label>
                        </div>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-[0_4px_12px_rgba(195,33,33,0.3)] font-label-md text-label-md text-white bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors duration-200">
                        <span class="material-symbols-outlined mr-2">how_to_reg</span> Register &amp; Verify
                    </button>
                </div>
                
                </form></div></main></body></html>
